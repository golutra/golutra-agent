[workspace]
members = [
  "crates/golutra-agent-app-server",
  "crates/golutra-agent-auth",
  "crates/golutra-agent-cli",
  "crates/golutra-agent-client",
  "crates/golutra-agent-code-intelligence",
  "crates/golutra-agent-config",
  "crates/golutra-agent-context",
  "crates/golutra-agent-core",
  "crates/golutra-agent-eval",
  "crates/golutra-agent-eval-model",
  "crates/golutra-agent-eval-worker",
  "crates/golutra-agent-evolution",
  "crates/golutra-agent-event",
  "crates/golutra-agent-file-search",
  "crates/golutra-agent-governor",
  "crates/golutra-agent-llm",
  "crates/golutra-agent-memory",
  "crates/golutra-agent-mcp",
  "crates/golutra-agent-policy",
  "crates/golutra-agent-plugin",
  "crates/golutra-agent-protocol",
  "crates/golutra-agent-protocol-fixtures",
  "crates/golutra-agent-project-service",
  "crates/golutra-agent-runtime",
  "crates/golutra-agent-release",
  "crates/golutra-agent-sandbox",
  "crates/golutra-agent-store",
  "crates/golutra-agent-supervisor",
  "crates/golutra-agent-test-client",
  "crates/golutra-agent-tools",
  "crates/golutra-agent-tui",
  "crates/golutra-agent-verify",
  "crates/golutra-agent-vis",
]
resolver = "3"

[workspace.package]
version = "0.3.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/golutra/golutra-agent"
homepage = "https://github.com/golutra/golutra-agent"
documentation = "https://github.com/golutra/golutra-agent/tree/main/docs"
description = "Simple local-first coding agent with a terminal UI, background work, and observable results."
readme = "README.md"
keywords = ["ai", "agent", "coding-agent", "runtime", "tui"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.93"

[workspace.dependencies]
anyhow = "1.0"
async-stream = "0.3"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = { version = "0.28", features = ["event-stream"] }
fs2 = "0.4"
futures-util = "0.3"
genai = { version = "=0.7.0-beta.22", default-features = false }
eventsource-stream = "0.2.3"
ignore = "0.4"
jsonschema = { version = "0.47", default-features = false }
miette = { version = "7.6", features = ["fancy"] }
nix = { version = "0.31", default-features = false, features = ["process", "signal"] }
oauth2 = { version = "5.0", default-features = false, features = ["reqwest", "rustls-tls"] }
percent-encoding = "2.3"
pulldown-cmark = "0.13"
ratatui = "0.28"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
reqwest13 = { package = "reqwest", version = "0.13.4", default-features = false, features = ["rustls-no-provider"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rmcp = { version = "3.1.4", default-features = false, features = ["client", "macros", "server", "transport-child-process", "transport-io"] }
schemars = { version = "1.0", features = ["chrono04", "uuid1"] }
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
similar = "2.7"
shlex = "1.3"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "uuid", "json"] }
tempfile = "3.20"
thiserror = "2.0"
tree-sitter = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
tokio-tungstenite = "0.29"
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1.17", features = ["serde", "v4", "v5", "v7"] }
unicode-segmentation = "1.13"
unicode-width = "0.1.14"
webbrowser = "1.0"
walkdir = "2.5"

golutra-agent-release = { path = "crates/golutra-agent-release", version = "0.3.1" }
golutra-agent-supervisor = { path = "crates/golutra-agent-supervisor", version = "0.3.1" }

golutra-agent-core = { path = "crates/golutra-agent-core", version = "0.3.1" }
golutra-agent-protocol = { path = "crates/golutra-agent-protocol", version = "0.3.1" }
golutra-agent-protocol-fixtures = { path = "crates/golutra-agent-protocol-fixtures", version = "0.3.1" }
golutra-agent-project-service = { path = "crates/golutra-agent-project-service", version = "0.3.1" }
golutra-agent-sandbox = { path = "crates/golutra-agent-sandbox", version = "0.3.1" }
