[workspace]
members = [
  "crates/golutra-app-server",
  "crates/golutra-cli",
  "crates/golutra-client",
  "crates/golutra-config",
  "crates/golutra-context",
  "crates/golutra-core",
  "crates/golutra-eval",
  "crates/golutra-event",
  "crates/golutra-file-search",
  "crates/golutra-governor",
  "crates/golutra-llm",
  "crates/golutra-memory",
  "crates/golutra-policy",
  "crates/golutra-protocol",
  "crates/golutra-protocol-fixtures",
  "crates/golutra-runtime",
  "crates/golutra-store",
  "crates/golutra-test-client",
  "crates/golutra-tools",
  "crates/golutra-tui",
  "crates/golutra-verify",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/golutra/golutra-agent"
rust-version = "1.93"

[workspace.dependencies]
anyhow = "1.0"
async-stream = "0.3"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.28"
miette = { version = "7.6", features = ["fancy"] }
ratatui = "0.28"
schemars = { version = "1.0", features = ["chrono04", "uuid1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "uuid", "json"] }
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1.17", features = ["serde", "v4", "v7"] }

golutra-core = { path = "crates/golutra-core" }
golutra-protocol = { path = "crates/golutra-protocol" }
golutra-protocol-fixtures = { path = "crates/golutra-protocol-fixtures" }
