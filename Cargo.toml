[workspace]
members = [
  "crates/golutra-app-server",
  "crates/golutra-auth",
  "crates/golutra-cli",
  "crates/golutra-client",
  "crates/golutra-code-intelligence",
  "crates/golutra-config",
  "crates/golutra-context",
  "crates/golutra-core",
  "crates/golutra-eval",
  "crates/golutra-eval-model",
  "crates/golutra-eval-worker",
  "crates/golutra-evolution",
  "crates/golutra-event",
  "crates/golutra-file-search",
  "crates/golutra-governor",
  "crates/golutra-llm",
  "crates/golutra-memory",
  "crates/golutra-mcp",
  "crates/golutra-policy",
  "crates/golutra-plugin",
  "crates/golutra-protocol",
  "crates/golutra-protocol-fixtures",
  "crates/golutra-project-service",
  "crates/golutra-runtime",
  "crates/golutra-release",
  "crates/golutra-sandbox",
  "crates/golutra-store",
  "crates/golutra-supervisor",
  "crates/golutra-test-client",
  "crates/golutra-tools",
  "crates/golutra-tui",
  "crates/golutra-verify",
  "crates/golutra-vis",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/golutra/golutra-agent"
homepage = "https://github.com/golutra/golutra-agent"
documentation = "https://github.com/golutra/golutra-agent/tree/main/docs"
description = "Rust-first local coding agent runtime with a terminal UI, CLI, typed protocol, and SDKs."
readme = "README.md"
keywords = ["ai", "agent", "coding-agent", "runtime", "tui"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.93"

[workspace.dependencies]
anyhow = "1.0"
async-stream = "0.3"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = { version = "0.28", features = ["event-stream"] }
fs2 = "0.4"
futures-util = "0.3"
genai = { version = "=0.7.0-beta.12", default-features = false }
eventsource-stream = "0.2.3"
ignore = "0.4"
jsonschema = { version = "0.47", default-features = false }
miette = { version = "7.6", features = ["fancy"] }
nix = { version = "0.30", default-features = false, features = ["process", "signal"] }
oauth2 = { version = "5.0", default-features = false, features = ["reqwest", "rustls-tls"] }
pulldown-cmark = "0.13"
ratatui = "0.28"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
reqwest13 = { package = "reqwest", version = "0.13.4", default-features = false, features = ["rustls-no-provider"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rmcp = { version = "2.2.0", default-features = false, features = ["client", "macros", "server", "transport-child-process", "transport-io"] }
schemars = { version = "1.0", features = ["chrono04", "uuid1"] }
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
similar = "2.7"
shlex = "1.3"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "uuid", "json"] }
tempfile = "3.20"
thiserror = "2.0"
tree-sitter = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
tokio-tungstenite = "0.29"
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1.17", features = ["serde", "v4", "v7"] }
unicode-segmentation = "1.13"
unicode-width = "0.1.14"
webbrowser = "1.0"
walkdir = "2.5"

golutra-release = { path = "crates/golutra-release", version = "0.1.0" }
golutra-supervisor = { path = "crates/golutra-supervisor", version = "0.1.0" }

golutra-core = { path = "crates/golutra-core", version = "0.1.0" }
golutra-protocol = { path = "crates/golutra-protocol", version = "0.1.0" }
golutra-protocol-fixtures = { path = "crates/golutra-protocol-fixtures", version = "0.1.0" }
golutra-project-service = { path = "crates/golutra-project-service", version = "0.1.0" }
golutra-sandbox = { path = "crates/golutra-sandbox", version = "0.1.0" }
