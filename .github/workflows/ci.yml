name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          components: clippy,rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: TypeScript SDK
        run: |
          npm ci --prefix sdk/typescript
          npm test --prefix sdk/typescript
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Release packaging smoke
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Protocol generation and Python SDK
        run: |
          cargo run -p golutra-protocol-fixtures --bin export_sdk_schema -- schemas/sdk-protocol.schema.json
          npm run --prefix sdk/typescript generate
          python3 sdk/python/scripts/generate.py
          python3 -m compileall -q sdk/python/src sdk/python/tests
          PYTHONPATH=sdk/python/src python3 -m unittest discover -s sdk/python/tests -v
          git diff --exit-code -- \
            schemas/sdk-protocol.schema.json \
            sdk/typescript/src/generated.ts \
            sdk/python/src/golutra_sdk/generated.py
          test -z "$(git status --porcelain --untracked-files=all -- \
            schemas/sdk-protocol.schema.json \
            sdk/typescript/src/generated.ts \
            sdk/python/src/golutra_sdk/generated.py)"

  tui-driver-process:
    name: TUI Driver process (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
      - name: Cross-process Driver lifecycle
        run: cargo test -p golutra-tui --test tui_driver_process -- --test-threads=1

  portable-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
      - name: Cross-platform compile
        run: cargo check --workspace --all-targets
