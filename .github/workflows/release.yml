name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep the release matrix explicit: the root npm package is generated
          # from the targets that actually produced a verified native artifact.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            npm_suffix: linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            npm_suffix: linux-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            npm_suffix: darwin-x64
          - os: macos-15
            target: aarch64-apple-darwin
            npm_suffix: darwin-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            npm_suffix: win32-x64
            rustflags: "-C target-feature=+crt-static"
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            npm_suffix: win32-arm64
            rustflags: "-C target-feature=+crt-static"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Open-source metadata
        shell: bash
        run: python scripts/check_open_source.py
      - name: Build and package release archive
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: python scripts/package_release.py --output-dir dist --target "${{ matrix.target }}"
      - name: Package native npm target
        shell: bash
        run: |
          python scripts/package_npm.py \
            --package platform \
            --target "${{ matrix.target }}" \
            --binary-dir "target/${{ matrix.target }}/release" \
            --output-dir dist/npm
      - name: Package matching npm root and run smoke test
        shell: bash
        run: |
          python scripts/package_npm.py \
            --package root \
            --targets "${{ matrix.target }}" \
            --output-dir .npm-smoke
          root_archive="$(find .npm-smoke -maxdepth 1 -type f -name 'golutra-agent-npm-[0-9]*.tgz' -print -quit)"
          platform_archive="$(find dist/npm -maxdepth 1 -type f -name 'golutra-agent-npm-${{ matrix.npm_suffix }}-*.tgz' -print -quit)"
          test -n "$root_archive"
          test -n "$platform_archive"
          smoke_args=()
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            smoke_args+=(--require-pty)
          fi
          python scripts/smoke_npm_package.py \
            --root-tarball "$root_archive" \
            --platform-tarball "$platform_archive" \
            "${smoke_args[@]}"
      - name: Native desktop offline acceptance (no Node/npm on PATH)
        shell: bash
        run: |
          native_archive="$(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print -quit)"
          npm_archive="$(find dist/npm -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          smoke_args=()
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            smoke_args+=(--require-pty)
          fi
          python scripts/smoke_native_package.py --archive "$native_archive" --npm-archive "$npm_archive" "${smoke_args[@]}"
          cargo test --locked -p golutra-agent-auth --test shared_credentials_process
          cargo test --locked -p golutra-agent-config --test shared_settings_process
          cargo test --locked -p golutra-agent-store --test shared_data_process
          cargo test --locked -p golutra-agent-client shared_home_tests
      - name: Refuse obsolete npm data in both directions (no migration)
        shell: bash
        run: |
          mkdir -p .compatibility-baseline
          npm pack "@golutra/agent-${{ matrix.npm_suffix }}@0.2.0" --ignore-scripts --pack-destination .compatibility-baseline
          baseline_archive="$(find .compatibility-baseline -maxdepth 1 -name '*.tgz' -print -quit)"
          suffix=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then suffix=".exe"; fi
          python scripts/smoke_shared_versions.py \
            --baseline-npm-archive "$baseline_archive" --baseline-version 0.2.0 \
            --candidate-cli "target/${{ matrix.target }}/release/golutra-agent$suffix" \
            --output "dist/shared-versions-${{ matrix.target }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: golutra-agent-${{ matrix.target }}
          path: dist/**
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install OIDC-capable npm
        run: npm install --global npm@11.17.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Check release metadata and build root npm package
        shell: bash
        run: |
          python scripts/check_open_source.py
          version="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          with (Path('Cargo.toml')).open('rb') as source:
              print(tomllib.load(source)['workspace']['package']['version'])
          PY
          )"
          test "${GITHUB_REF_NAME#v}" = "$version"
          mapfile -t platform_manifests < <(
            while IFS= read -r -d '' manifest; do
              if [[ "$(jq -r '.kind' "$manifest")" = "platform" ]]; then
                printf '%s\n' "$manifest"
              fi
            done < <(
              find release-assets -type f -name 'golutra-agent-npm-*.tgz.manifest.json' -print0
            ) | sort
          )
          test "${#platform_manifests[@]}" -eq 6
          for manifest in "${platform_manifests[@]}"; do
            jq -e --arg version "$version" \
              '.kind == "platform" and .version == $version and (.target | type == "string") and (.tarball | type == "string")' \
              "$manifest" >/dev/null
          done
          mapfile -t targets < <(
            printf '%s\n' "${platform_manifests[@]}" \
              | xargs -r jq -r '.target' \
              | sort -u
          )
          expected_targets=(
            aarch64-apple-darwin
            aarch64-pc-windows-msvc
            aarch64-unknown-linux-gnu
            x86_64-apple-darwin
            x86_64-pc-windows-msvc
            x86_64-unknown-linux-gnu
          )
          test "${#targets[@]}" -eq "${#expected_targets[@]}"
          test "$(printf '%s\n' "${targets[@]}")" = "$(printf '%s\n' "${expected_targets[@]}")"
          python scripts/package_npm.py \
            --package root \
            --version "$version" \
            --targets "${targets[@]}" \
            --output-dir release-assets/npm
          root_manifest="release-assets/npm/golutra-agent-npm-$version.tgz.manifest.json"
          test -f "$root_manifest"
          jq . "$root_manifest"
      - name: Verify desktop inventory and npm/native payload parity
        run: python scripts/desktop_release.py --dist release-assets
      - name: Publish platform npm packages with OIDC provenance
        shell: bash
        env:
          NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          if [[ -n "$NPM_BOOTSTRAP_TOKEN" ]]; then
            export NODE_AUTH_TOKEN="$NPM_BOOTSTRAP_TOKEN"
          fi
          mapfile -t platform_manifests < <(
            while IFS= read -r -d '' manifest; do
              if [[ "$(jq -r '.kind' "$manifest")" = "platform" ]]; then
                printf '%s\n' "$manifest"
              fi
            done < <(
              find release-assets -type f -name 'golutra-agent-npm-*.tgz.manifest.json' -print0
            ) | sort
          )
          test "${#platform_manifests[@]}" -eq 6
          for manifest in "${platform_manifests[@]}"; do
            test "$(jq -r '.kind' "$manifest")" = "platform"
            package="$(jq -r '.package' "$manifest")"
            version="$(jq -r '.version' "$manifest")"
            archive="$(jq -r '.tarball' "$manifest")"
            mapfile -t matches < <(find release-assets -type f -name "$archive" -print)
            test "${#matches[@]}" -eq 1
            if [[ "$(npm view "$package@$version" version 2>/dev/null || true)" = "$version" ]]; then
              echo "$package@$version is already published; skipping"
              continue
            fi
            npm publish "${matches[0]}" \
              --provenance --access public
          done
      - name: Publish npm root package with OIDC provenance
        shell: bash
        env:
          NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          if [[ -n "$NPM_BOOTSTRAP_TOKEN" ]]; then
            export NODE_AUTH_TOKEN="$NPM_BOOTSTRAP_TOKEN"
          fi
          version="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          with (Path('Cargo.toml')).open('rb') as source:
              print(tomllib.load(source)['workspace']['package']['version'])
          PY
          )"
          root_archive="release-assets/npm/golutra-agent-npm-$version.tgz"
          test -f "$root_archive"
          if [[ "$(npm view "@golutra/agent@$version" version 2>/dev/null || true)" = "$version" ]]; then
            echo "@golutra/agent@$version is already published; skipping"
            exit 0
          fi
          npm publish "$root_archive" \
            --provenance --access public
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**
          fail_on_unmatched_files: true
