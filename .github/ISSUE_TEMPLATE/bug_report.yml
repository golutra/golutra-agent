name: Bug report
description: Report a reproducible problem in Golutra Agent
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please remove credentials, private workspace data, and unredacted provider payloads.
        Use the security policy for vulnerabilities.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "0.1.0 or 8251a47"
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - TUI
        - CLI
        - Runtime
        - App server or transport
        - Rust SDK or protocol
        - Python SDK
        - TypeScript SDK
        - Release tooling
        - Documentation
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "macOS 15, Rust 1.93, provider protocol"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the smallest command or input that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and redacted logs
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and removed sensitive data from this report.
          required: true
